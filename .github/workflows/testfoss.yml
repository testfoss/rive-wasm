name: Testfoss demo

on:
  push:
    branches: [testfoss-demo]
  pull_request:
    branches: [testfoss-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testfoss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canvas-single:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAKEFLAGS: -j2
      RIVE_WASM_EMSDK_VERSION: 4.0.23
    steps:
      - name: Check out fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install browser tooling
        run: |
          npm install -g @lmctl-ai/lmctl@0.2.469
          npm ci --prefix testfoss
          testfoss/node_modules/.bin/playwright install --with-deps chromium

      - name: Build canvas-single with pinned nested runtime
        run: ./testfoss/build.sh

      - name: Check animation and Canvas2D output through lmwebtest
        run: ./testfoss/browser.sh

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testfoss-rive-browser
          path: testfoss/results/
          if-no-files-found: warn
